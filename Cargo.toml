[package]
name = "fm-cli"
version = "0.1.0"
edition = "2021"
description = "A fast, robust command-line football management game inspired by Football Manager"
license = "MIT"

[[bin]]
name = "fm"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_pcg = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
